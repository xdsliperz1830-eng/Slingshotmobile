# Runs the dependency-free game logic checks on every push and PR.
name: Verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check inline script parses
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/game.js
          node --check /tmp/game.js

      - name: Run game logic checks
        run: node tools/verify.js
